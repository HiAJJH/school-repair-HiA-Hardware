<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>群聊</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  :root {
    --grad: linear-gradient(135deg,#f59e0b,#ea580c);
    --bg: #f4e7d3;
    --bubble: #ffffff;
    --bubble-mine: linear-gradient(135deg,#f59e0b,#ea580c);
    --text: #1f2937;
    --meta: #8a6f4f;
    --input-bg: #ffffff;
    --input-border: #dfc9a3;
    --tool-bg: #f1f5f9;
  }
  [data-theme="dark"] {
    --grad: linear-gradient(135deg,#2563eb,#06b6d4);
    --bg: #0b1120;
    --bubble: #1e293b;
    --bubble-mine: linear-gradient(135deg,#2563eb,#06b6d4);
    --text: #e2e8f0;
    --meta: #8b9bb0;
    --input-bg: #151f32;
    --input-border: #263349;
    --tool-bg: #263349;
  }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; transition:background .3s,color .3s; }
  .header { background:var(--grad); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .header .title { font-size:16px; font-weight:700; white-space:nowrap; }
  .header input { flex:1; min-width:0; padding:7px 10px; border:none; border-radius:8px; font-size:13px; background:rgba(255,255,255,.2); color:#fff; }
  .header input::placeholder { color:rgba(255,255,255,.7); }
  .header .theme-toggle, .header .close { background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:8px; width:32px; height:32px; cursor:pointer; font-size:16px; flex-shrink:0; }
  .header .online { font-size:11px; background:rgba(34,197,94,.3); padding:2px 8px; border-radius:10px; white-space:nowrap; }

  .messages { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  .msg { display:flex; flex-direction:column; max-width:82%; align-self:flex-start; animation:msgIn .25s ease; }
  @keyframes msgIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .msg.mine { align-self:flex-end; align-items:flex-end; }
  .msg .meta { font-size:11px; color:var(--meta); margin-bottom:2px; }
  .msg .bubble { background:var(--bubble); color:var(--text); padding:9px 13px; border-radius:14px; font-size:14px; word-break:break-word; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .msg.mine .bubble { background:var(--bubble-mine); color:#fff; }
  .msg .bubble img { max-width:200px; max-height:240px; border-radius:10px; display:block; cursor:pointer; }
  .msg .bubble video { max-width:200px; max-height:240px; border-radius:10px; display:block; }
  .msg .bubble audio { max-width:220px; }

  .inputbar { background:var(--input-bg); border-top:1px solid var(--input-border); padding:10px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .inputbar .tool { background:var(--tool-bg); border:none; border-radius:10px; width:40px; height:40px; font-size:19px; cursor:pointer; flex-shrink:0; }
  .inputbar .tool.rec { background:#ef4444; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
  .inputbar input[type=text] { flex:1; min-width:0; padding:11px 13px; border:1px solid var(--input-border); border-radius:22px; font-size:14px; background:var(--input-bg); color:var(--text); }
  .inputbar input[type=text]::placeholder { color:var(--meta); }
  .inputbar .send { background:var(--grad); color:#fff; border:none; border-radius:22px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer; flex-shrink:0; }
  .hint { text-align:center; font-size:11px; color:var(--meta); padding:8px; }
</style>
</head>
<body>

<div class="header">
  <span class="title">💬 群聊</span>
  <span class="online">在线</span>
  <input id="myName" placeholder="你的称呼">
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换深浅色">🌙</button>
  <button class="theme-toggle" id="clearBtn" onclick="clearChat()" title="清除聊天记录" style="display:none;">🗑️</button>
  <button class="close" onclick="history.back()">✕</button>
</div>

<div class="messages" id="msgList">
  <div class="hint" style="margin:auto;">加载中…</div>
</div>

<div class="inputbar">
  <button class="tool" onclick="document.getElementById('imgInput').click()" title="图片">🖼️</button>
  <button class="tool" onclick="document.getElementById('vidInput').click()" title="视频">🎬</button>
  <button class="tool" id="voiceBtn" onclick="toggleVoice()" title="语音">🎤</button>
  <input type="text" id="textInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendText()">
  <button class="send" onclick="sendText()">发送</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleFile(this,'image')">
  <input type="file" id="vidInput" accept="video/*" style="display:none" onchange="handleFile(this,'video')">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = (t === 'dark') ? '☀️' : '🌙';
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = (cur === 'dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  }
  (function initTheme(){
    var saved = localStorage.getItem('theme');
    var h = new Date().getHours();
    var autoDark = (h >= 19 || h < 7);
    applyTheme(saved || (autoDark ? 'dark' : 'light'));
  })();

  var cfg = window.SITE_CONFIG || {};
  var URL_ = cfg.SUPABASE_URL, KEY = cfg.SUPABASE_ANON_KEY;
  var configured = URL_ && KEY && URL_.indexOf("你的") === -1 && KEY.indexOf("你的") === -1;

  var sb = null;
  if(configured && window.supabase){
    sb = window.supabase.createClient(URL_, KEY);
  }
  function showClearBtn(){
    var btn = document.getElementById('clearBtn');
    if(btn) btn.style.display = 'block';
  }
  if(sb){
    sb.auth.getSession().then(function(s){
      if(s.data && s.data.session){ showClearBtn(); }
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function fmt(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  var myName = new URLSearchParams(location.search).get('name') || localStorage.getItem('group_name') || '';
  var nameEl = document.getElementById('myName');
  nameEl.value = myName;
  nameEl.placeholder = '请输入你的称呼';
  if(!myName && sb){
    autoDefaultName().then(function(n){
      myName = n;
      nameEl.value = n;
      localStorage.setItem('group_name', n);
    });
  }
  if(myName === '客服'){ showClearBtn(); }
  nameEl.addEventListener('change', function(){
    var n = this.value.trim();
    if(!n){ this.value = myName; return; }
    if(n === myName) return;
    autoClaimName(n).then(function(finalName){
      myName = finalName;
      nameEl.value = finalName;
      if(finalName !== n){ toast('该称呼已被占用，已自动改为「'+finalName+'」'); }
    });
  });

  async function tryClaimName(n){
    var res = await sb.from('chat_names').select('*').eq('name', n).maybeSingle();
    if(res.data){
      var claimedAt = new Date(res.data.claimed_at).getTime();
      if(claimedAt > (Date.now() - 24*3600*1000) && localStorage.getItem('group_name') !== n){
        return false;
      }
    }
    await sb.from('chat_names').upsert([{ name: n, claimed_at: new Date().toISOString() }]);
    localStorage.setItem('group_name', n);
    return true;
  }

  async function autoClaimName(base){
    if(!sb) return base;
    var candidate = base;
    var i = 2;
    while(i < 200){
      var ok = await tryClaimName(candidate);
      if(ok) return candidate;
      candidate = base + i;
      i++;
    }
    candidate = base + Math.floor(Math.random()*1000);
    await tryClaimName(candidate);
    return candidate;
  }

  async function autoDefaultName(){
    if(!sb) return '同学1';
    try {
      var res = await sb.from('chat_names').select('name');
      var maxN = 0;
      (res.data || []).forEach(function(r){
        var m = (r.name || '').match(/^同学(\d+)$/);
        if(m){ maxN = Math.max(maxN, parseInt(m[1], 10)); }
      });
      return autoClaimName('同学' + (maxN + 1));
    } catch(e){ return '同学1'; }
  }

  async function ensureName(){
    if(!sb) return myName || '同学';
    var n = nameEl.value.trim();
    if(!n){ alert('请先填写你的称呼'); return null; }
    if(n === myName){
      sb.from('chat_names').upsert([{ name: n, claimed_at: new Date().toISOString() }]);
      return myName;
    }
    var finalName = await autoClaimName(n);
    myName = finalName;
    nameEl.value = finalName;
    if(finalName !== n){ toast('该称呼已被占用，已自动改为「'+finalName+'」'); }
    return finalName;
  }

  function toast(t){
    var el = document.getElementById('toast'); if(!el){
      el = document.createElement('div'); el.id='toast';
      el.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;';
      document.body.appendChild(el);
    }
    el.textContent=t; el.style.display='block';
    setTimeout(function(){ el.style.display='none'; },2000);
  }

  async function clearChat(){
    if(!confirm('确定要清除所有聊天记录吗？此操作不可恢复！')) return;
    var res = await sb.from('group_messages').delete().neq('id','00000000-0000-0000-0000-000000000000');
    if(res.error){ alert('清除失败：'+res.error.message); return; }
    loadMessages();
    toast('已清除聊天记录');
  }

  function loadMessages(){
    if(!sb) return;
    sb.from('group_messages').select('*').order('created_at', { ascending:true }).limit(200).then(function(res){
      if(!res.error) renderMessages(res.data || []);
    });
  }

  var knownIds = {};

  function renderBody(m){
    if(m.type === 'image') return '<img src="'+esc(m.content)+'" onclick="window.open(this.src)">';
    if(m.type === 'video') return '<video src="'+esc(m.content)+'" controls preload="metadata"></video>';
    if(m.type === 'voice') return '<audio src="'+esc(m.content)+'" controls></audio>';
    return esc(m.content);
  }

  function msgHtml(m){
    var mine = (m.name === myName);
    var cls = 'msg' + (mine ? ' mine' : '');
    return '<div class="'+cls+'"><div class="meta">'+esc(m.name)+' · '+fmt(m.created_at)+'</div><div class="bubble">'+renderBody(m)+'</div></div>';
  }

  function smoothScroll(el){
    requestAnimationFrame(function(){
      el.scrollTo({ top: el.scrollHeight, behavior:'smooth' });
      setTimeout(function(){ el.scrollTop = el.scrollHeight; }, 400);
    });
  }

  function renderMessages(list){
    var el = document.getElementById('msgList');
    knownIds = {};
    list.forEach(function(m){ knownIds[m.id] = true; });
    if(!list.length){ el.innerHTML = '<div class="hint" style="margin:auto;">还没有消息，来打个招呼吧 👋</div>'; return; }
    el.innerHTML = list.map(msgHtml).join('');
    smoothScroll(el);
  }

  function appendMessage(m){
    var el = document.getElementById('msgList');
    var hint = el.querySelector('.hint');
    if(hint) hint.remove();
    var tmp = document.createElement('div');
    tmp.innerHTML = msgHtml(m);
    el.appendChild(tmp.firstChild);
    smoothScroll(el);
  }

  async function sendText(){
    if(!sb){ alert('还没连接数据库'); return; }
    var n = await ensureName();
    if(!n) return;
    var txt = document.getElementById('textInput').value.trim();
    if(!txt) return;
    sb.from('group_messages').insert([{ name: n, type:'text', content:txt }]).then(function(res){
      if(res.error){ alert('发送失败：'+res.error.message); return; }
      document.getElementById('textInput').value = '';
      loadMessages();
    });
  }

  async function handleFile(input, type){
    var file = input.files[0];
    input.value = '';
    if(!file || !sb) return;
    var n = await ensureName();
    if(!n) return;
    if(file.size > 30*1024*1024){ alert('文件太大，请小于 30MB'); return; }
    var ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    var folder = (type === 'image') ? 'img' : 'video';
    var path = folder + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
    var res = await sb.storage.from('chat').upload(path, file);
    if(res.error){ alert('上传失败：'+res.error.message); return; }
    var url = sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
    sb.from('group_messages').insert([{ name: n, type:type, content:url }]).then(function(r){
      if(r.error){ alert('发送失败：'+r.error.message); return; }
      loadMessages();
    });
  }

  var mediaRecorder = null, audioChunks = [], recording = false;
  async function toggleVoice(){
    if(recording){
      mediaRecorder.stop();
      recording = false;
      document.getElementById('voiceBtn').classList.remove('rec');
      return;
    }
    try {
      var stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      var mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      mediaRecorder = new MediaRecorder(stream, mime ? { mimeType:mime } : undefined);
      audioChunks = [];
      mediaRecorder.ondataavailable = function(e){ if(e.data.size>0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        var blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        await sendVoice(blob);
      };
      mediaRecorder.start();
      recording = true;
      document.getElementById('voiceBtn').classList.add('rec');
    } catch(e){
      alert('无法录音：' + e.message);
    }
  }

  async function sendVoice(blob){
    if(!sb) return;
    var n = await ensureName();
    if(!n) return;
    var ext = (blob.type.indexOf('ogg') >= 0) ? 'ogg' : 'webm';
    var path = 'voice/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
    var res = await sb.storage.from('chat').upload(path, blob);
    if(res.error){ alert('上传失败：'+res.error.message); return; }
    var url = sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
    sb.from('group_messages').insert([{ name: n, type:'voice', content:url }]).then(function(r){
      if(r.error){ alert('发送失败：'+r.error.message); return; }
      loadMessages();
    });
  }

  function playTone(){
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [880, 1174.66].forEach(function(f, i){
        var o = ctx.createOscillator(); var g = ctx.createGain();
        o.type='sine'; o.frequency.value=f;
        var t = ctx.currentTime + i*0.15;
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t+0.3);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t+0.3);
      });
    } catch(e){}
  }

  var reloadTimer = null;
  function scheduleReload(){
    if(reloadTimer) clearTimeout(reloadTimer);
    reloadTimer = setTimeout(function(){
      reloadTimer = null;
      loadMessages();
    }, 300);
  }

  if(sb){
    sb.channel('group-chat-live')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'group_messages' }, function(payload){
        var row = payload.new;
        if(row && !knownIds[row.id]){
          appendMessage(row);
          knownIds[row.id] = true;
          if(row.name !== myName) playTone();
        }
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'group_messages' }, function(){
        scheduleReload();
      })
      .subscribe();
  }

  loadMessages();
</script>

</body>
</html>
