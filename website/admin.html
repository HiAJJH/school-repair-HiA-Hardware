<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 预约统计</title>
<style>
  :root { --blue:#2e74b5; --dark:#1f4e79; --bg:#f5f7fa; --card:#fff; --line:#e3e8ee; --text:#333; --muted:#8a94a3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:20px 0 40px; }
  .wrap { max-width:760px; margin:0 auto; padding:0 14px; }

  /* 登录 */
  .login { max-width:360px; margin:80px auto; background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); padding:28px; }
  .login h1 { font-size:20px; color:var(--dark); margin-bottom:16px; text-align:center; }
  .login input { width:100%; padding:11px; margin-top:10px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  .login button { width:100%; margin-top:14px; padding:12px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
  .msg { margin-top:10px; font-size:13px; color:#c0392b; text-align:center; }
  .msg.ok { color:#27ae60; }

  /* 面板 */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .topbar span { color:var(--muted); font-size:13px; }
  .topbar button { padding:8px 14px; background:var(--dark); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
  .topbar button.danger { background:#c0392b; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; }
  .card { flex:1; min-width:150px; background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); padding:18px; text-align:center; }
  .card .num { font-size:28px; font-weight:700; color:var(--dark); }
  .card .lbl { font-size:13px; color:var(--muted); margin-top:4px; }
  .panel { background:var(--card); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); padding:20px; margin-top:14px; }
  .panel h2 { font-size:16px; color:var(--dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; }
  .panel h2 button { padding:6px 12px; background:#eef4fb; color:var(--blue); border:none; border-radius:6px; cursor:pointer; font-size:12px; }

  .bar-row { display:flex; align-items:center; margin:8px 0; font-size:13px; }
  .bar-row .name { width:130px; flex-shrink:0; }
  .bar-row .track { flex:1; background:#eef1f5; border-radius:4px; height:18px; overflow:hidden; }
  .bar-row .fill { height:100%; background:linear-gradient(90deg,var(--blue),#5aa7e8); border-radius:4px; }
  .bar-row .cnt { width:40px; text-align:right; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 6px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="loginBox" class="login">
    <h1>管理后台登录</h1>
    <input id="email" type="email" placeholder="管理员邮箱">
    <input id="password" type="password" placeholder="密码">
    <button onclick="login()">登 录</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <!-- 数据面板 -->
  <div id="dash" style="display:none;">
    <div class="topbar">
      <span id="welcome"></span>
      <div>
        <button onclick="clearAll()" class="danger">清空数据</button>
        <button onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="cards">
      <div class="card"><div class="num" id="total">0</div><div class="lbl">总预约数</div></div>
      <div class="card"><div class="num" id="today">0</div><div class="lbl">今日新增</div></div>
      <div class="card"><div class="num" id="revenue">¥0</div><div class="lbl">预计收入区间</div></div>
    </div>

    <div class="panel">
      <h2>服务类型分布</h2>
      <div id="breakdown"></div>
    </div>

    <div class="panel">
      <h2>最近预约 <button onclick="copyTable()">复制为表格(粘到Excel)</button></h2>
      <div style="overflow-x:auto;">
        <table id="orders">
          <thead><tr><th>姓名</th><th>联系方式</th><th>服务</th><th>设备</th><th>问题</th><th>时间</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
<div id="toast" class="toast">已复制</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  var cfg = window.SITE_CONFIG || {};
  var SUPABASE_URL = cfg.SUPABASE_URL;
  var SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
  var configured = SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.indexOf("你的") === -1 && SUPABASE_ANON_KEY.indexOf("你的") === -1;

  var PRICE = {
    '笔记本清灰': [89],
    '系统重装/优化': [9.9, 19.9],
    '硬件升级': [19.9],
    '二手设备回收': [0, 0],
    '二手设备购买咨询': [0, 0]
  };

  var sb = null;
  var allOrders = [];

  function msg(t, ok) {
    var m = document.getElementById('loginMsg');
    m.textContent = t;
    m.className = 'msg' + (ok ? ' ok' : '');
  }

  function initSb() {
    if (!configured || !window.supabase) {
      msg('请先在 config.js 里填好 Supabase 地址和公钥', false);
      return false;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }

  // 页面加载时，若已登录则直接进面板
  (async function () {
    if (!initSb()) return;
    var s = await sb.auth.getSession();
    if (s.data && s.data.session) { showDash(s.data.session.user.email); loadData(); }
  })();

  async function login() {
    if (!initSb()) return;
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    msg('登录中…', true);
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) { msg('登录失败：' + res.error.message, false); return; }
    showDash(res.data.user.email);
    loadData();
  }

  function showDash(email) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('welcome').textContent = '管理员：' + email;
  }

  async function logout() {
    await sb.auth.signOut();
    location.reload();
  }

  async function clearAll() {
    if (!confirm('确定要清空所有预约数据吗？此操作不可恢复！')) return;
    var res = await sb.from('orders').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (res.error) { alert('清空失败：' + res.error.message); return; }
    loadData();
    alert('已清空全部数据');
  }

  async function loadData() {
    var res = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(500);
    if (res.error) { alert('读取失败：' + res.error.message); return; }
    allOrders = res.data || [];
    render();
  }

  function render() {
    var orders = allOrders;
    document.getElementById('total').textContent = orders.length;

    var todayStr = new Date().toDateString();
    var todayCount = orders.filter(function (o) { return new Date(o.created_at).toDateString() === todayStr; }).length;
    document.getElementById('today').textContent = todayCount;

    // 收入区间
    var min = 0, max = 0;
    orders.forEach(function (o) {
      var p = PRICE[o.service] || [0, 0];
      min += p[0];
      max += (p.length > 1 ? p[1] : p[0]);
    });
    document.getElementById('revenue').textContent = (min === 0 && max === 0) ? '¥0' : ('¥' + min + '~¥' + max);

    // 服务分布
    var counts = {};
    orders.forEach(function (o) { counts[o.service] = (counts[o.service] || 0) + 1; });
    var maxCount = Math.max(1, Math.max.apply(null, Object.keys(counts).map(function (k) { return counts[k]; })));
    var bd = document.getElementById('breakdown');
    bd.innerHTML = '';
    if (!orders.length) { bd.innerHTML = '<div class="empty">暂无数据</div>'; }
    Object.keys(counts).forEach(function (k) {
      var pct = Math.round(counts[k] / maxCount * 100);
      var row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = '<span class="name">' + k + '</span><span class="track"><span class="fill" style="width:' + pct + '%"></span></span><span class="cnt">' + counts[k] + '</span>';
      bd.appendChild(row);
    });

    // 表格
    var tb = document.querySelector('#orders tbody');
    tb.innerHTML = '';
    if (!orders.length) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">还没有预约，把网址分享出去吧</td></tr>';
      return;
    }
    orders.forEach(function (o) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + esc(o.name) + '</td><td>' + esc(o.phone) + '</td><td>' + esc(o.service) + '</td><td>' + esc(o.device || '') + '</td><td>' + esc(o.problem || '') + '</td><td>' + fmt(o.created_at) + '</td>';
      tb.appendChild(tr);
    });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }

  function fmt(t) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function copyTable() {
    var lines = ['姓名\t联系方式\t服务\t设备\t问题\t时间'];
    allOrders.forEach(function (o) {
      lines.push([o.name, o.phone, o.service, o.device || '', o.problem || '', fmt(o.created_at)].join('\t'));
    });
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast, function () { fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); showToast();
  }
  function showToast() {
    var t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(function () { t.style.display = 'none'; }, 1500);
  }
</script>
</body>
</html>
