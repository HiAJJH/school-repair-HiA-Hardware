<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 数据与内容</title>
<style>
  :root {
    --grad:linear-gradient(135deg,#f59e0b,#ea580c);
    --blue:#ea580c; --cyan:#d97706;
    --bg:#f4e7d3; --card:#faf0e0; --card2:#eeddbf; --line:#dfc9a3;
    --text:#3f2d1e; --muted:#8a6f4f; --heading:#2c1d12;
    --input-bg:#fdf5e7; --input-text:#3f2d1e; --placeholder:#ab8f68;
    --topbtn-bg:#3f2d1e; --topbtn-text:#fdf5e7;
    --edit-bg:#fbe8cc; --edit-text:#ea580c;
    --del-bg:#fdeaea; --del-text:#b91c1c;
  }
  [data-theme="dark"] {
    --grad:linear-gradient(135deg,#2563eb,#06b6d4);
    --blue:#3b82f6; --cyan:#22d3ee;
    --bg:#0b1120; --card:#151f32; --card2:#1a2537; --line:#263349;
    --text:#e2e8f0; --muted:#8b9bb0; --heading:#f1f5f9;
    --input-bg:#0b1120; --input-text:#e2e8f0; --placeholder:#5b6b82;
    --topbtn-bg:#1e293b; --topbtn-text:#ffffff;
    --edit-bg:#1a2537; --edit-text:#22d3ee;
    --del-bg:#3b1414; --del-text:#fca5a5;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:20px 0 40px; transition:background .3s,color .3s; }
  .wrap { max-width:820px; margin:0 auto; padding:0 16px; }

  .theme-toggle { position:fixed; top:14px; right:14px; width:42px; height:42px; border-radius:50%; background:var(--card); border:1px solid var(--line); cursor:pointer; font-size:19px; z-index:100; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 10px rgba(0,0,0,.18); }

  .login { max-width:360px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:30px; }
  .login h1 { font-size:20px; color:var(--heading); margin-bottom:16px; text-align:center; }
  .login input { width:100%; padding:12px; margin-top:10px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:var(--input-bg); color:var(--input-text); }
  .login input::placeholder { color:var(--placeholder); }
  .login button { width:100%; margin-top:14px; padding:13px; background:var(--grad); color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; }
  .msg { margin-top:10px; font-size:13px; color:#dc2626; text-align:center; }
  .msg.ok { color:#047857; }

  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .topbar .welcome { color:var(--muted); font-size:13px; }
  .topbar .btns { display:flex; gap:8px; }
  .topbar button { padding:8px 14px; background:var(--topbtn-bg); color:var(--topbtn-text); border:none; border-radius:8px; cursor:pointer; font-size:13px; }
  .topbar button.danger { background:#dc2626; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { flex:1; padding:12px; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; }
  .tab.active { background:var(--grad); color:#fff; border-color:transparent; }

  .cards { display:flex; gap:12px; flex-wrap:wrap; }
  .card { flex:1; min-width:150px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; text-align:center; }
  .card .num { font-size:28px; font-weight:700; color:var(--heading); font-family:ui-monospace,SFMono-Regular,monospace; }
  .card .lbl { font-size:13px; color:var(--muted); margin-top:4px; }

  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:14px; }
  .panel h2 { font-size:16px; color:var(--heading); margin-bottom:12px; padding-left:10px; border-left:3px solid var(--cyan); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .panel h2 .hint { font-size:12px; color:var(--muted); font-weight:400; }
  .panel h2 button { padding:6px 12px; background:var(--card2); color:var(--cyan); border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:12px; }

  .bar-row { display:flex; align-items:center; margin:8px 0; font-size:13px; }
  .bar-row .name { width:140px; flex-shrink:0; color:var(--text); }
  .bar-row .track { flex:1; background:var(--card2); border-radius:4px; height:18px; overflow:hidden; }
  .bar-row .fill { height:100%; background:var(--grad); border-radius:4px; }
  .bar-row .cnt { width:40px; text-align:right; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 6px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }

  .sv-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .sv-row .info { flex:1; min-width:200px; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .sv-row .info b { color:var(--heading); }
  .sv-row .info span { color:var(--muted); font-size:12px; display:block; }
  .sv-row .info .p { color:#ea580c; font-weight:700; font-size:12.5px; }
  .sv-row button { padding:7px 12px; border:none; border-radius:8px; cursor:pointer; font-size:12px; }
  .btn-edit { background:var(--edit-bg); color:var(--edit-text); border:1px solid var(--line); }
  .btn-del { background:var(--del-bg); color:var(--del-text); border:1px solid var(--line); }

  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .field input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; background:var(--input-bg); color:var(--input-text); }
  .field input::placeholder { color:var(--placeholder); }
  .field input:focus { outline:none; border-color:var(--cyan); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .btn-primary { width:100%; margin-top:6px; padding:12px; background:var(--grad); color:#fff; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; display:none; z-index:99; }

  .switch { position:relative; display:inline-block; width:52px; height:28px; }
  .switch input { opacity:0; width:0; height:0; }
  .switch .slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#94a3b8; border-radius:20px; transition:.3s; }
  .switch .slider:before { content:""; position:absolute; height:22px; width:22px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s; }
  .switch input:checked + .slider { background:var(--grad); }
  .switch input:checked + .slider:before { transform:translateX(24px); }


</style>
</head>
<body>
<div class="wrap">

  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换深浅色">🌙</button>

  <div id="loginBox" class="login">
    <h1>管理后台登录</h1>
    <input id="email" type="email" placeholder="管理员邮箱">
    <input id="password" type="password" placeholder="密码">
    <button onclick="login()">登 录</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <div id="dash" style="display:none;">
    <div class="topbar">
      <span class="welcome" id="welcome"></span>
      <div class="btns">
        <button onclick="location.href='chat.html?name=客服'">💬 群聊</button>
        <button onclick="clearAll()" class="danger">清空预约数据</button>
        <button onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabBtnStats" onclick="switchTab('stats')">数据统计</button>
      <button class="tab" id="tabBtnContent" onclick="switchTab('content')">内容管理</button>
    </div>

    <div id="tab-stats">
      <div class="cards">
        <div class="card"><div class="num" id="total">0</div><div class="lbl">总预约数</div></div>
        <div class="card"><div class="num" id="today">0</div><div class="lbl">今日新增</div></div>
        <div class="card"><div class="num" id="week">0</div><div class="lbl">近7天新增</div></div>
      </div>

      <div class="panel">
        <h2>服务类型分布</h2>
        <div id="breakdown"></div>
      </div>

      <div class="panel">
        <h2>最近预约 <button onclick="copyTable()">复制为表格</button></h2>
        <div style="overflow-x:auto;">
          <table id="orders">
            <thead><tr><th>姓名</th><th>联系方式</th><th>服务</th><th>设备</th><th>问题</th><th>时间</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-content" style="display:none;">
      <div class="panel">
        <h2>接单状态 <span class="hint">一键切换接单中/休息中</span></h2>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div id="statusLabel" style="font-size:15px;font-weight:700;color:var(--heading);">🟢 接单中</div>
          <label class="switch">
            <input type="checkbox" id="statusSwitch" onchange="toggleStatus()">
            <span class="slider"></span>
          </label>
          <span style="font-size:12px;color:var(--muted);">开启=接单中 · 关闭=休息中</span>
        </div>
      </div>

      <div class="panel">
        <h2>顶部 Logo <span class="hint">上传照片替换顶部图标</span></h2>
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <div id="logoPreview" style="width:84px;height:84px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);overflow:hidden;border:1px solid var(--line);flex-shrink:0;">未上传</div>
          <div style="flex:1;min-width:220px;">
            <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">建议正方形图片，小于 200KB</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <label style="display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--grad);color:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">上传图片<input type="file" id="logoFile" accept="image/*" style="display:none;" onchange="handleLogoFile(this)"></label>
              <button onclick="saveLogo()" style="padding:9px 14px;background:var(--card2);color:var(--cyan);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;">保存</button>
              <button onclick="removeLogo()" style="padding:9px 14px;background:var(--del-bg);color:var(--del-text);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;">移除</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>服务项目 <span class="hint">可改价格、增删服务</span></h2>
        <div id="svList"></div>
        <div style="margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;">
          <div class="grid2">
            <div class="field"><label>服务名称</label><input id="svName" placeholder="如：笔记本清灰"></div>
            <div class="field"><label>价格</label><input id="svPrice" placeholder="如：89元 / 30-50元"></div>
          </div>
          <div class="field"><label>服务描述（选填）</label><input id="svDesc" placeholder="如：拆机除尘、换硅脂、清理风扇"></div>
          <button class="btn-primary" onclick="addService()">＋ 添加服务</button>
        </div>
      </div>
    </div>

  </div>

</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  // ===== 日夜模式 =====
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = (t === 'dark') ? '☀️' : '🌙';
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = (cur === 'dark') ? 'light' : 'dark';
    localStorage.setItem('theme', next);
    applyTheme(next);
  }
  (function initTheme(){
    var saved = localStorage.getItem('theme');
    var h = new Date().getHours();
    var autoDark = (h >= 19 || h < 7);
    applyTheme(saved || (autoDark ? 'dark' : 'light'));
  })();

  var cfg = window.SITE_CONFIG || {};
  var SUPABASE_URL = cfg.SUPABASE_URL;
  var SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
  var configured = SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.indexOf("你的") === -1 && SUPABASE_ANON_KEY.indexOf("你的") === -1;

  var sb = null;
  var allOrders = [];
  var pendingLogo = null;
  var currentLogo = '';
  var realtimeSubscribed = false;

  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function fmt(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  function msg(t, ok){ var m=document.getElementById('loginMsg'); m.textContent=t; m.className='msg'+(ok?' ok':''); }
  function initSb(){ if(!configured||!window.supabase){ msg('请先在 config.js 里填好 Supabase 地址和公钥',false); return false; } sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return true; }

  (async function(){ if(!initSb()) return; var s=await sb.auth.getSession(); if(s.data&&s.data.session){ showDash(s.data.session.user.email); loadData(); loadServices(); loadLogo(); loadStatus(); } })();

  async function login(){ if(!initSb()) return; var email=document.getElementById('email').value.trim(); var password=document.getElementById('password').value; msg('登录中…',true); var res=await sb.auth.signInWithPassword({email:email,password:password}); if(res.error){ msg('登录失败：'+res.error.message,false); return; } showDash(res.data.user.email); loadData(); loadServices(); loadLogo(); loadStatus(); }
  function showDash(email){ document.getElementById('loginBox').style.display='none'; document.getElementById('dash').style.display='block'; document.getElementById('welcome').textContent='管理员：'+email; subscribeRealtime(); }

  function subscribeRealtime(){
    if(!sb || realtimeSubscribed) return;
    realtimeSubscribed = true;
    sb.channel('orders-live')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'orders' }, function(){
        loadData();
        playTone();
        toast('🔔 收到新预约');
      })
      .subscribe();
  }

  function playTone(){
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [880, 1174.66].forEach(function(f, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        var t = ctx.currentTime + i * 0.15;
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.3);
      });
    } catch(e){}
  }

  async function logout(){ await sb.auth.signOut(); location.reload(); }

  function switchTab(t){
    document.getElementById('tab-stats').style.display = (t==='stats')?'block':'none';
    document.getElementById('tab-content').style.display = (t==='content')?'block':'none';
    document.getElementById('tabBtnStats').className = 'tab' + (t==='stats'?' active':'');
    document.getElementById('tabBtnContent').className = 'tab' + (t==='content'?' active':'');
  }

  async function loadData(){
    var res = await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500);
    if(res.error){ alert('读取失败：'+res.error.message); return; }
    allOrders = res.data || [];
    render();
  }

  function render(){
    var orders = allOrders;
    document.getElementById('total').textContent = orders.length;
    var now = new Date();
    var todayStr = now.toDateString();
    var todayCount = orders.filter(function(o){ return new Date(o.created_at).toDateString()===todayStr; }).length;
    document.getElementById('today').textContent = todayCount;
    var weekAgo = now.getTime() - 7*24*3600*1000;
    var weekCount = orders.filter(function(o){ return new Date(o.created_at).getTime() >= weekAgo; }).length;
    document.getElementById('week').textContent = weekCount;

    var counts = {};
    orders.forEach(function(o){ counts[o.service]=(counts[o.service]||0)+1; });
    var maxCount = Math.max(1, Math.max.apply(null, Object.keys(counts).map(function(k){return counts[k];})));
    var bd = document.getElementById('breakdown');
    bd.innerHTML = '';
    if(!orders.length){ bd.innerHTML='<div class="empty">暂无数据</div>'; }
    Object.keys(counts).forEach(function(k){
      var pct = Math.round(counts[k]/maxCount*100);
      var row = document.createElement('div');
      row.className='bar-row';
      row.innerHTML='<span class="name">'+esc(k)+'</span><span class="track"><span class="fill" style="width:'+pct+'%"></span></span><span class="cnt">'+counts[k]+'</span>';
      bd.appendChild(row);
    });

    var tb = document.querySelector('#orders tbody');
    tb.innerHTML = '';
    if(!orders.length){ tb.innerHTML='<tr><td colspan="6" class="empty">还没有预约，把网址分享出去吧</td></tr>'; return; }
    orders.forEach(function(o){
      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(o.name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.service)+'</td><td>'+esc(o.device||'')+'</td><td>'+esc(o.problem||'')+'</td><td>'+fmt(o.created_at)+'</td>';
      tb.appendChild(tr);
    });
  }

  async function clearAll(){
    if(!confirm('确定要清空所有预约数据吗？此操作不可恢复！')) return;
    var res = await sb.from('orders').delete().neq('id','00000000-0000-0000-0000-000000000000');
    if(res.error){ alert('清空失败：'+res.error.message); return; }
    loadData(); toast('已清空全部预约数据');
  }

  function copyTable(){
    var lines=['姓名\t联系方式\t服务\t设备\t问题\t时间'];
    allOrders.forEach(function(o){ lines.push([o.name,o.phone,o.service,o.device||'',o.problem||'',fmt(o.created_at)].join('\t')); });
    var text=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast('已复制')},function(){fallbackCopy(text);}); }
    else { fallbackCopy(text); }
  }
  function fallbackCopy(text){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制'); }

  async function loadServices(){
    var res = await sb.from('services').select('*').order('sort_order');
    if(res.error){ document.getElementById('svList').innerHTML='<div class="empty">读取失败：'+esc(res.error.message)+'</div>'; return; }
    renderServices(res.data||[]);
  }

  function renderServices(list){
    var box = document.getElementById('svList');
    box.innerHTML = '';
    if(!list.length){ box.innerHTML='<div class="empty">还没有服务项目，用下面表单添加</div>'; return; }
    list.forEach(function(s){
      var row=document.createElement('div');
      row.className='sv-row';
      row.innerHTML = '<div class="info"><b>'+esc(s.name)+'</b><span>'+esc(s.description||'')+'</span><span class="p">'+esc(s.price||'')+'</span></div>' +
        '<button class="btn-edit" onclick="changePrice(\''+s.id+'\',\''+jsq(s.name)+'\',\''+jsq(s.price)+'\')">改价</button>' +
        '<button class="btn-del" onclick="delService(\''+s.id+'\',\''+jsq(s.name)+'\')">删除</button>';
      box.appendChild(row);
    });
  }

  function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }

  async function changePrice(id, name, price){
    var np = prompt('修改「'+name+'」的价格：', price || '');
    if(np === null) return;
    np = np.trim();
    if(!np){ alert('价格不能为空'); return; }
    var res = await sb.from('services').update({ price: np }).eq('id', id);
    if(res.error){ alert('修改失败：'+res.error.message); return; }
    loadServices(); toast('价格已更新');
  }

  async function addService(){
    var name = document.getElementById('svName').value.trim();
    var price = document.getElementById('svPrice').value.trim();
    if(!name){ alert('请填写服务名称'); return; }
    if(!price){ alert('请填写价格'); return; }
    var data = {
      name: name,
      price: price,
      description: document.getElementById('svDesc').value.trim(),
      sort_order: 999
    };
    var res = await sb.from('services').insert([data]);
    if(res.error){ alert('添加失败：'+res.error.message); return; }
    document.getElementById('svName').value='';
    document.getElementById('svPrice').value='';
    document.getElementById('svDesc').value='';
    loadServices(); toast('已添加服务');
  }

  async function delService(id, name){
    if(!confirm('确定删除「'+name+'」吗？')) return;
    var res = await sb.from('services').delete().eq('id', id);
    if(res.error){ alert('删除失败：'+res.error.message); return; }
    loadServices(); toast('已删除');
  }

  async function loadLogo(){
    var res = await sb.from('settings').select('*');
    if(res.error) return;
    var map={}; (res.data||[]).forEach(function(r){ map[r.key]=r.value; });
    currentLogo = map.logo || '';
    var pv = document.getElementById('logoPreview');
    if(currentLogo){
      pv.innerHTML = '<img src="'+currentLogo+'" style="width:100%;height:100%;object-fit:cover;">';
    } else {
      pv.innerHTML = '未上传';
    }
  }

  function handleLogoFile(input){
    var file = input.files[0];
    if(!file) return;
    if(file.size > 200*1024){ alert('图片太大，请选择小于 200KB 的图片'); input.value=''; return; }
    var reader = new FileReader();
    reader.onload = function(e){
      pendingLogo = e.target.result;
      var pv = document.getElementById('logoPreview');
      pv.innerHTML = '<img src="'+pendingLogo+'" style="width:100%;height:100%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  }

  async function saveLogo(){
    if(!pendingLogo){ alert('请先点击「上传图片」选择一张图'); return; }
    var res = await sb.from('settings').upsert([{ key:'logo', value: pendingLogo }]);
    if(res.error){ alert('保存失败：'+res.error.message); return; }
    currentLogo = pendingLogo;
    toast('Logo 已保存');
  }

  async function removeLogo(){
    if(!confirm('确定移除 Logo 吗？')) return;
    var res = await sb.from('settings').upsert([{ key:'logo', value:'' }]);
    if(res.error){ alert('移除失败：'+res.error.message); return; }
    pendingLogo = null; currentLogo = '';
    document.getElementById('logoPreview').innerHTML = '未上传';
    document.getElementById('logoFile').value = '';
    toast('已移除 Logo');
  }

  async function loadStatus(){
    var res = await sb.from('settings').select('*');
    if(res.error) return;
    var map={}; (res.data||[]).forEach(function(r){ map[r.key]=r.value; });
    var open = (map.status !== 'closed');
    document.getElementById('statusSwitch').checked = open;
    document.getElementById('statusLabel').textContent = open ? '🟢 接单中' : '⏸️ 休息中';
  }

  async function toggleStatus(){
    var sw = document.getElementById('statusSwitch');
    var open = sw.checked;
    var res = await sb.from('settings').upsert([{ key:'status', value: open ? 'open' : 'closed' }]);
    if(res.error){ alert('切换失败：'+res.error.message); sw.checked = !open; return; }
    document.getElementById('statusLabel').textContent = open ? '🟢 接单中' : '⏸️ 休息中';
    toast(open ? '已切换为「接单中」' : '已切换为「休息中」');
  }

  function toast(t){
    var el=document.getElementById('toast');
    el.textContent=t; el.style.display='block';
    setTimeout(function(){ el.style.display='none'; },1500);
  }
</script>
</body>
</html>
