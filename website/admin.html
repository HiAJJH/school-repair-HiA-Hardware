<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 数据统计与内容管理</title>
<style>
  :root { --blue:#3b82f6; --indigo:#6366f1; --dark:#1e3a5f; --bg:#f4f6fb; --card:#fff; --line:#e6eaf2; --text:#2b3442; --muted:#8a94a3; --grad:linear-gradient(135deg,#3b82f6,#6366f1 55%,#8b5cf6); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:20px 0 40px; }
  .wrap { max-width:820px; margin:0 auto; padding:0 16px; }

  .login { max-width:360px; margin:80px auto; background:var(--card); border-radius:16px; box-shadow:0 6px 20px rgba(30,60,120,.1); padding:30px; }
  .login h1 { font-size:20px; color:var(--dark); margin-bottom:16px; text-align:center; }
  .login input { width:100%; padding:12px; margin-top:10px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; }
  .login button { width:100%; margin-top:14px; padding:13px; background:var(--grad); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
  .msg { margin-top:10px; font-size:13px; color:#c0392b; text-align:center; }
  .msg.ok { color:#27ae60; }

  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .topbar .welcome { color:var(--muted); font-size:13px; }
  .topbar .btns { display:flex; gap:8px; }
  .topbar button { padding:8px 14px; background:var(--dark); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:13px; }
  .topbar button.danger { background:#c0392b; }

  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tab { flex:1; padding:12px; background:#e9edf6; color:var(--muted); border:none; border-radius:10px; cursor:pointer; font-size:14px; font-weight:600; }
  .tab.active { background:var(--grad); color:#fff; box-shadow:0 4px 12px rgba(99,102,241,.3); }

  .cards { display:flex; gap:12px; flex-wrap:wrap; }
  .card { flex:1; min-width:150px; background:var(--card); border-radius:14px; box-shadow:0 4px 16px rgba(30,60,120,.08); padding:18px; text-align:center; }
  .card .num { font-size:28px; font-weight:700; color:var(--dark); }
  .card .lbl { font-size:13px; color:var(--muted); margin-top:4px; }

  .panel { background:var(--card); border-radius:14px; box-shadow:0 4px 16px rgba(30,60,120,.08); padding:20px; margin-top:14px; }
  .panel h2 { font-size:16px; color:var(--dark); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .panel h2 .hint { font-size:12px; color:var(--muted); font-weight:400; }
  .panel h2 button { padding:6px 12px; background:#eef4fb; color:var(--blue); border:none; border-radius:6px; cursor:pointer; font-size:12px; }

  .bar-row { display:flex; align-items:center; margin:8px 0; font-size:13px; }
  .bar-row .name { width:140px; flex-shrink:0; }
  .bar-row .track { flex:1; background:#eef1f5; border-radius:4px; height:18px; overflow:hidden; }
  .bar-row .fill { height:100%; background:var(--grad); border-radius:4px; }
  .bar-row .cnt { width:40px; text-align:right; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:8px 6px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:20px; }

  /* 内容管理 */
  .sv-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
  .sv-row .info { flex:1; min-width:200px; background:#f8faff; border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  .sv-row .info b { color:var(--dark); }
  .sv-row .info span { color:var(--muted); font-size:12px; display:block; }
  .sv-row .info .p { color:#ea580c; font-weight:600; font-size:12.5px; }
  .sv-row button { padding:7px 12px; border:none; border-radius:8px; cursor:pointer; font-size:12px; }
  .btn-edit { background:#eef4fb; color:var(--blue); }
  .btn-del { background:#fdeaea; color:#c0392b; }
  .btn-add { background:var(--grad); color:#fff; font-weight:600; }

  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; }
  .field input, .field textarea { width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; background:#fbfcfe; }
  .field input:focus, .field textarea:focus { outline:none; border-color:var(--blue); background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
  .save-btn { width:100%; margin-top:6px; padding:12px; background:var(--grad); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#27ae60; color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; display:none; z-index:99; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="loginBox" class="login">
    <h1>管理后台登录</h1>
    <input id="email" type="email" placeholder="管理员邮箱">
    <input id="password" type="password" placeholder="密码">
    <button onclick="login()">登 录</button>
    <p id="loginMsg" class="msg"></p>
  </div>

  <!-- 面板 -->
  <div id="dash" style="display:none;">
    <div class="topbar">
      <span class="welcome" id="welcome"></span>
      <div class="btns">
        <button onclick="clearAll()" class="danger">清空预约数据</button>
        <button onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabBtnStats" onclick="switchTab('stats')">📊 数据统计</button>
      <button class="tab" id="tabBtnContent" onclick="switchTab('content')">📝 内容管理</button>
    </div>

    <!-- 数据统计 -->
    <div id="tab-stats">
      <div class="cards">
        <div class="card"><div class="num" id="total">0</div><div class="lbl">总预约数</div></div>
        <div class="card"><div class="num" id="today">0</div><div class="lbl">今日新增</div></div>
        <div class="card"><div class="num" id="week">0</div><div class="lbl">近7天新增</div></div>
      </div>

      <div class="panel">
        <h2>服务类型分布</h2>
        <div id="breakdown"></div>
      </div>

      <div class="panel">
        <h2>最近预约 <button onclick="copyTable()">复制为表格(粘到Excel)</button></h2>
        <div style="overflow-x:auto;">
          <table id="orders">
            <thead><tr><th>姓名</th><th>联系方式</th><th>服务</th><th>设备</th><th>问题</th><th>时间</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 内容管理 -->
    <div id="tab-content" style="display:none;">
      <div class="panel">
        <h2>服务项目 <span class="hint">增删改后，客户页刷新即生效</span></h2>
        <div id="svList"></div>
        <div style="margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;">
          <div class="grid2">
            <div class="field"><label>服务名称</label><input id="svName" placeholder="如：笔记本清灰"></div>
            <div class="field"><label>价格显示</label><input id="svPrice" placeholder="如：一口价89元 / 30-50 元"></div>
          </div>
          <div class="field"><label>图标（一个emoji，如 🧹💻⚡♻️🛒）</label><input id="svIcon" placeholder="如：🧹"></div>
          <div class="field"><label>服务描述</label><input id="svDesc" placeholder="如：拆机除尘、换硅脂、清理风扇"></div>
          <div class="field"><label>排序（数字越小越靠前）</label><input id="svSort" type="number" value="10"></div>
          <button class="save-btn" id="svSubmitBtn" onclick="saveService()">＋ 添加服务</button>
        </div>
      </div>

      <div class="panel">
        <h2>网站文字 <span class="hint">改完点保存，客户页即更新</span></h2>
        <div class="field"><label>顶部大标题</label><input id="stTitle"></div>
        <div class="field"><label>顶部副标题</label><input id="stSubtitle"></div>
        <div class="grid2">
          <div class="field"><label>联系电话（一键拨打）</label><input id="stPhone"></div>
          <div class="field"><label>微信号（一键复制）</label><input id="stWechat"></div>
        </div>
        <div class="field"><label>联系方式展示文字</label><input id="stContact"></div>
        <div class="field"><label>公告栏文字（留空则不显示）</label><input id="stNotice"></div>
        <div class="field"><label>底部版权文字</label><input id="stFooter"></div>
        <button class="save-btn" onclick="saveSettings()">💾 保存网站文字</button>
      </div>
    </div>
  </div>

</div>
<div id="toast" class="toast">已复制</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  var cfg = window.SITE_CONFIG || {};
  var SUPABASE_URL = cfg.SUPABASE_URL;
  var SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
  var configured = SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.indexOf("你的") === -1 && SUPABASE_ANON_KEY.indexOf("你的") === -1;

  var sb = null;
  var allOrders = [];
  var editingServiceId = null;

  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function fmt(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

  function msg(t, ok){ var m=document.getElementById('loginMsg'); m.textContent=t; m.className='msg'+(ok?' ok':''); }
  function initSb(){ if(!configured||!window.supabase){ msg('请先在 config.js 里填好 Supabase 地址和公钥',false); return false; } sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); return true; }

  (async function(){ if(!initSb()) return; var s=await sb.auth.getSession(); if(s.data&&s.data.session){ showDash(s.data.session.user.email); loadData(); loadServices(); loadSettings(); } })();

  async function login(){ if(!initSb()) return; var email=document.getElementById('email').value.trim(); var password=document.getElementById('password').value; msg('登录中…',true); var res=await sb.auth.signInWithPassword({email:email,password:password}); if(res.error){ msg('登录失败：'+res.error.message,false); return; } showDash(res.data.user.email); loadData(); loadServices(); loadSettings(); }
  function showDash(email){ document.getElementById('loginBox').style.display='none'; document.getElementById('dash').style.display='block'; document.getElementById('welcome').textContent='管理员：'+email; }
  async function logout(){ await sb.auth.signOut(); location.reload(); }

  function switchTab(t){
    document.getElementById('tab-stats').style.display = (t==='stats')?'block':'none';
    document.getElementById('tab-content').style.display = (t==='content')?'block':'none';
    document.getElementById('tabBtnStats').className = 'tab' + (t==='stats'?' active':'');
    document.getElementById('tabBtnContent').className = 'tab' + (t==='content'?' active':'');
  }

  // ---------- 数据统计 ----------
  async function loadData(){
    var res = await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500);
    if(res.error){ alert('读取失败：'+res.error.message); return; }
    allOrders = res.data || [];
    render();
  }

  function render(){
    var orders = allOrders;
    document.getElementById('total').textContent = orders.length;
    var now = new Date();
    var todayStr = now.toDateString();
    var todayCount = orders.filter(function(o){ return new Date(o.created_at).toDateString()===todayStr; }).length;
    document.getElementById('today').textContent = todayCount;
    var weekAgo = now.getTime() - 7*24*3600*1000;
    var weekCount = orders.filter(function(o){ return new Date(o.created_at).getTime() >= weekAgo; }).length;
    document.getElementById('week').textContent = weekCount;

    var counts = {};
    orders.forEach(function(o){ counts[o.service]=(counts[o.service]||0)+1; });
    var maxCount = Math.max(1, Math.max.apply(null, Object.keys(counts).map(function(k){return counts[k];})));
    var bd = document.getElementById('breakdown');
    bd.innerHTML = '';
    if(!orders.length){ bd.innerHTML='<div class="empty">暂无数据</div>'; }
    Object.keys(counts).forEach(function(k){
      var pct = Math.round(counts[k]/maxCount*100);
      var row = document.createElement('div');
      row.className='bar-row';
      row.innerHTML='<span class="name">'+esc(k)+'</span><span class="track"><span class="fill" style="width:'+pct+'%"></span></span><span class="cnt">'+counts[k]+'</span>';
      bd.appendChild(row);
    });

    var tb = document.querySelector('#orders tbody');
    tb.innerHTML = '';
    if(!orders.length){ tb.innerHTML='<tr><td colspan="6" class="empty">还没有预约，把网址分享出去吧</td></tr>'; return; }
    orders.forEach(function(o){
      var tr=document.createElement('tr');
      tr.innerHTML='<td>'+esc(o.name)+'</td><td>'+esc(o.phone)+'</td><td>'+esc(o.service)+'</td><td>'+esc(o.device||'')+'</td><td>'+esc(o.problem||'')+'</td><td>'+fmt(o.created_at)+'</td>';
      tb.appendChild(tr);
    });
  }

  async function clearAll(){
    if(!confirm('确定要清空所有预约数据吗？此操作不可恢复！')) return;
    var res = await sb.from('orders').delete().neq('id','00000000-0000-0000-0000-000000000000');
    if(res.error){ alert('清空失败：'+res.error.message); return; }
    loadData(); toast('已清空全部预约数据');
  }

  function copyTable(){
    var lines=['姓名\t联系方式\t服务\t设备\t问题\t时间'];
    allOrders.forEach(function(o){ lines.push([o.name,o.phone,o.service,o.device||'',o.problem||'',fmt(o.created_at)].join('\t')); });
    var text=lines.join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast('已复制')},function(){fallbackCopy(text);}); }
    else { fallbackCopy(text); }
  }
  function fallbackCopy(text){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('已复制'); }

  // ---------- 内容管理：服务 ----------
  async function loadServices(){
    var res = await sb.from('services').select('*').order('sort_order');
    if(res.error){ document.getElementById('svList').innerHTML='<div class="empty">读取失败：'+esc(res.error.message)+'</div>'; return; }
    renderServices(res.data||[]);
  }

  function renderServices(list){
    var box = document.getElementById('svList');
    box.innerHTML = '';
    if(!list.length){ box.innerHTML='<div class="empty">还没有服务项目，用下面表单添加</div>'; return; }
    list.forEach(function(s){
      var row=document.createElement('div');
      row.className='sv-row';
      row.innerHTML = '<div class="info"><b>'+(s.icon?esc(s.icon)+' ':'')+esc(s.name)+'</b><span>'+esc(s.description||'')+'</span><span class="p">'+esc(s.price||'')+' · 排序'+esc(s.sort_order)+'</span></div>' +
        '<button class="btn-edit" onclick="editService(\''+s.id+'\',\''+jsq(s.name)+'\',\''+jsq(s.description)+'\',\''+jsq(s.price)+'\',\''+s.sort_order+'\',\''+jsq(s.icon)+'\')">编辑</button>' +
        '<button class="btn-del" onclick="delService(\''+s.id+'\')">删除</button>';
      box.appendChild(row);
    });
  }

  // 转义供 onclick 字符串使用
  function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' '); }

  function editService(id,name,desc,price,sort,icon){
    editingServiceId = id;
    document.getElementById('svName').value = name;
    document.getElementById('svDesc').value = desc;
    document.getElementById('svPrice').value = price;
    document.getElementById('svSort').value = sort;
    document.getElementById('svIcon').value = icon || '';
    document.getElementById('svSubmitBtn').textContent = '💾 保存修改';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function resetServiceForm(){
    editingServiceId = null;
    document.getElementById('svName').value='';
    document.getElementById('svDesc').value='';
    document.getElementById('svPrice').value='';
    document.getElementById('svSort').value='10';
    document.getElementById('svIcon').value='';
    document.getElementById('svSubmitBtn').textContent='＋ 添加服务';
  }

  async function saveService(){
    var name = document.getElementById('svName').value.trim();
    if(!name){ alert('请填写服务名称'); return; }
    var data = {
      name: name,
      icon: document.getElementById('svIcon').value.trim(),
      description: document.getElementById('svDesc').value.trim(),
      price: document.getElementById('svPrice').value.trim(),
      sort_order: parseInt(document.getElementById('svSort').value||'10',10)
    };
    var res;
    if(editingServiceId){
      res = await sb.from('services').update(data).eq('id', editingServiceId);
    } else {
      res = await sb.from('services').insert([data]);
    }
    if(res.error){ alert('保存失败：'+res.error.message); return; }
    resetServiceForm();
    loadServices();
    toast(editingServiceId ? '已更新服务' : '已添加服务');
  }

  async function delService(id){
    if(!confirm('确定删除这个服务吗？')) return;
    var res = await sb.from('services').delete().eq('id', id);
    if(res.error){ alert('删除失败：'+res.error.message); return; }
    loadServices(); toast('已删除');
  }

  // ---------- 内容管理：设置 ----------
  async function loadSettings(){
    var res = await sb.from('settings').select('*');
    if(res.error) return;
    var map={}; (res.data||[]).forEach(function(r){ map[r.key]=r.value; });
    document.getElementById('stTitle').value = map.hero_title || '';
    document.getElementById('stSubtitle').value = map.hero_subtitle || '';
    document.getElementById('stPhone').value = map.phone || '';
    document.getElementById('stWechat').value = map.wechat || '';
    document.getElementById('stContact').value = map.contact || '';
    document.getElementById('stNotice').value = map.notice || '';
    document.getElementById('stFooter').value = map.footer || '';
  }

  async function saveSettings(){
    var rows = [
      { key:'hero_title', value:document.getElementById('stTitle').value },
      { key:'hero_subtitle', value:document.getElementById('stSubtitle').value },
      { key:'phone', value:document.getElementById('stPhone').value },
      { key:'wechat', value:document.getElementById('stWechat').value },
      { key:'contact', value:document.getElementById('stContact').value },
      { key:'notice', value:document.getElementById('stNotice').value },
      { key:'footer', value:document.getElementById('stFooter').value }
    ];
    var res = await sb.from('settings').upsert(rows);
    if(res.error){ alert('保存失败：'+res.error.message); return; }
    toast('网站文字已保存');
  }

  function toast(t){
    var el=document.getElementById('toast');
    el.textContent=t; el.style.display='block';
    setTimeout(function(){ el.style.display='none'; },1500);
  }
</script>
</body>
</html>
