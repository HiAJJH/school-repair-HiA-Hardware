<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园电脑维修 · 预约与报价</title>
<style>
  :root {
    --indigo:#4f46e5; --violet:#7c3aed; --purple:#a855f7;
    --dark:#1e1b4b; --bg:#f6f7fb; --card:#ffffff; --line:#e8eaf6;
    --text:#2b2b3d; --muted:#8a8fa8; --orange:#f97316;
    --grad: linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#a855f7 100%);
    --shadow: 0 10px 30px rgba(79,70,229,.12);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; background:var(--bg); color:var(--text); line-height:1.65; padding-bottom:50px; -webkit-font-smoothing:antialiased; }

  /* 公告栏 */
  .notice { background:linear-gradient(90deg,#fef3c7,#fde68a); color:#92400e; font-size:13px; text-align:center; padding:9px 14px; }
  .notice b { margin-right:4px; }

  /* 顶部 */
  .hero { background:var(--grad); color:#fff; padding:52px 18px 44px; text-align:center; position:relative; overflow:hidden; }
  .hero .blob { position:absolute; border-radius:50%; filter:blur(46px); opacity:.45; }
  .b1 { width:220px; height:220px; background:#93c5fd; top:-70px; left:-50px; }
  .b2 { width:260px; height:260px; background:#e879f9; bottom:-90px; right:-60px; }
  .hero .inner { position:relative; z-index:1; max-width:640px; margin:0 auto; }
  .hero .logo { width:72px; height:72px; margin:0 auto 12px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:22px; display:flex; align-items:center; justify-content:center; font-size:36px; backdrop-filter:blur(4px); }
  .hero h1 { font-size:26px; margin-bottom:8px; letter-spacing:.5px; font-weight:800; }
  .hero p { opacity:.92; font-size:14px; }
  .hero .trust { margin-top:18px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .hero .trust span { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25); padding:5px 12px; border-radius:20px; font-size:12.5px; backdrop-filter:blur(4px); }

  .wrap { max-width:680px; margin:0 auto; padding:0 16px; }

  /* 快捷操作 */
  .quick { display:flex; gap:10px; margin-top:-20px; position:relative; z-index:2; }
  .qa { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:13px 10px; border-radius:14px; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; border:none; box-shadow:var(--shadow); transition:transform .12s; }
  .qa:active { transform:scale(.97); }
  .qa.call { background:#fff; color:var(--indigo); }
  .qa.wechat { background:var(--grad); color:#fff; }

  /* 区块 */
  .section { margin-top:28px; }
  .sec-title { font-size:18px; font-weight:800; color:var(--dark); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .sec-title::before { content:""; width:5px; height:20px; background:var(--grad); border-radius:3px; }
  .sec-title small { font-size:12px; color:var(--muted); font-weight:400; }

  /* 服务卡片 */
  .sv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .sv-card { background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; transition:all .15s; box-shadow:0 2px 8px rgba(0,0,0,.03); position:relative; }
  .sv-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:#c7d2fe; }
  .sv-card.selected { border-color:var(--violet); background:linear-gradient(180deg,#f5f3ff,#fff); box-shadow:0 0 0 3px rgba(124,58,237,.15); }
  .sv-card .ic { width:44px; height:44px; border-radius:12px; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:10px; }
  .sv-card .nm { font-weight:700; font-size:15px; color:var(--dark); }
  .sv-card .ds { font-size:12.5px; color:var(--muted); margin:4px 0 8px; min-height:34px; }
  .sv-card .pr { color:var(--orange); font-weight:800; font-size:14px; }
  .sv-card .go { position:absolute; top:14px; right:14px; font-size:12px; color:var(--violet); opacity:0; transition:opacity .15s; font-weight:600; }
  .sv-card:hover .go, .sv-card.selected .go { opacity:1; }
  .sv-card .check { display:none; position:absolute; top:12px; right:12px; width:20px; height:20px; border-radius:50%; background:var(--violet); color:#fff; font-size:12px; align-items:center; justify-content:center; }
  .sv-card.selected .check { display:flex; }
  .sv-card.selected .go { display:none; }

  /* 表单卡片 */
  .form-card { background:var(--card); border-radius:20px; box-shadow:var(--shadow); padding:24px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  input,select,textarea { width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:14px; font-family:inherit; background:#fbfbfe; transition:border .15s, background .15s; }
  input:focus,select:focus,textarea:focus { outline:none; border-color:var(--violet); background:#fff; }
  .btn-submit { width:100%; margin-top:20px; padding:15px; background:var(--grad); color:#fff; border:none; border-radius:14px; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(124,58,237,.35); transition:transform .12s, filter .12s; }
  .btn-submit:hover { filter:brightness(1.05); transform:translateY(-1px); }
  .btn-submit:active { transform:translateY(0); }
  .note { font-size:12px; color:var(--muted); margin-top:12px; text-align:center; }
  .ok-box { background:#e9f9ef; border:1px solid #bfe8cf; color:#1e7a46; border-radius:12px; padding:12px 14px; font-size:13px; margin-top:14px; }
  .err-box { background:#fdeaea; border:1px solid #f3c2c2; color:#b3261e; border-radius:12px; padding:12px 14px; font-size:13px; margin-top:14px; }
  .demo-box { background:#fff7e8; border:1px solid #f5e0b5; color:#8a6d1a; border-radius:12px; padding:12px 14px; font-size:13px; margin-top:14px; }

  /* FAQ */
  details { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  summary { padding:14px 16px; font-weight:700; font-size:14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  summary::after { content:"＋"; color:var(--violet); font-size:18px; }
  details[open] summary::after { content:"－"; }
  details p { padding:0 16px 14px; font-size:13px; color:var(--muted); }

  .footer { text-align:center; color:var(--muted); font-size:12px; margin-top:30px; }
</style>
</head>
<body>

<div id="noticeBar" class="notice" style="display:none;"></div>

<div class="hero">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="inner">
    <div class="logo">🛠️</div>
    <h1 id="heroTitle">加载中…</h1>
    <p id="heroSubtitle"></p>
    <div class="trust">
      <span>✅ 明码标价</span>
      <span>✅ 上门/校内取送</span>
      <span>✅ 修后保修</span>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="quick">
    <a class="qa call" id="callBtn" href="tel:">📞 一键拨打电话</a>
    <button class="qa wechat" onclick="copyWechat()">💬 复制微信号</button>
  </div>

  <div class="section">
    <h2 class="sec-title">服务项目 <small>点击卡片选择你要的服务</small></h2>
    <div class="sv-grid" id="svGrid">
      <div style="color:var(--muted);padding:20px;grid-column:1/-1;text-align:center;">加载中…</div>
    </div>
  </div>

  <div class="section" id="book">
    <h2 class="sec-title">在线预约</h2>
    <div class="form-card">
      <form id="orderForm">
        <label>姓名</label>
        <input type="text" id="name" placeholder="你的姓名" required>
        <label>联系方式</label>
        <input type="text" id="phone" placeholder="手机号或微信号" required>
        <label>服务类型</label>
        <select id="service"></select>
        <label>设备信息</label>
        <input type="text" id="device" placeholder="例如：联想拯救者 Y7000P 2021 / iPhone 12">
        <label>问题描述（选填）</label>
        <textarea id="desc" rows="3" placeholder="例如：电脑发热严重、风扇声音大，开机很慢"></textarea>
        <button type="submit" class="btn-submit">提交预约</button>
      </form>
      <p class="note">提交后会通过你填写的联系方式与您联系</p>
      <div id="result" style="display:none;"></div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">常见问题</h2>
    <details><summary>电脑清灰多久能好？</summary><p>一般 30~60 分钟可完成，视机器情况而定，可当面等或约时间取。</p></details>
    <details><summary>上门服务范围是哪里？</summary><p>校内及附近宿舍/教室均可上门，取送免费。</p></details>
    <details><summary>二手设备回收怎么估价？</summary><p>当面检测成色、配置后按行情报价，双方同意后当面付款。</p></details>
    <details><summary>维修后有保修吗？</summary><p>维修服务提供 3 天保修，非人为问题免费返修。</p></details>
  </div>

  <p class="footer" id="footer"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  var cfg = window.SITE_CONFIG || {};
  var SUPABASE_URL = cfg.SUPABASE_URL;
  var SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY;
  var configured = SUPABASE_URL && SUPABASE_ANON_KEY && SUPABASE_URL.indexOf("你的") === -1 && SUPABASE_ANON_KEY.indexOf("你的") === -1;

  var sb = null;
  if (configured && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession:false, autoRefreshToken:false, detectSessionInUrl:false }
    });
  }

  function esc(s){ return String(s==null?'':s).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); }
  function setText(id,val){ var el=document.getElementById(id); if(el) el.textContent=val; }

  var DEFAULTS = {
    hero_title:'校园电脑维修 · 预约与报价',
    hero_subtitle:'明码标价 · 上门/校内取送 · 修后保修',
    contact:(cfg.CONTACT||'请填写联系方式'),
    phone:'', wechat:'', notice:'',
    footer:'© 校园电脑维修工作室 · 有问题随时联系'
  };
  var DEFAULT_SERVICES = [
    { icon:'🧹', name:'笔记本清灰', description:'拆机除尘、换硅脂、清理风扇', price:'30-50 元' },
    { icon:'💻', name:'系统重装/优化', description:'装系统、装驱动、清理提速', price:'30-50 元' },
    { icon:'⚡', name:'硬件升级', description:'加内存、换固态硬盘', price:'工费 40-80 元' },
    { icon:'♻️', name:'二手回收', description:'上门检测、当面估价、当面付款', price:'按成色估价' },
    { icon:'🛒', name:'二手售卖', description:'附验机报告 + 3 天保修', price:'按行情定价' }
  ];

  var SERVICES = DEFAULT_SERVICES;
  var SETTINGS = DEFAULTS;

  function applySettings(){
    setText('heroTitle', SETTINGS.hero_title);
    setText('heroSubtitle', SETTINGS.hero_subtitle);
    setText('footer', SETTINGS.footer);
    document.title = SETTINGS.hero_title;
    // 快捷按钮
    var call = document.getElementById('callBtn');
    if(SETTINGS.phone){ call.href = 'tel:' + SETTINGS.phone; }
    else { call.href = '#'; }
    // 公告
    var nb = document.getElementById('noticeBar');
    if(SETTINGS.notice && SETTINGS.notice.trim()){
      nb.style.display='block'; nb.innerHTML='<b>📢</b>' + esc(SETTINGS.notice);
    } else { nb.style.display='none'; }
  }

  function renderServices(list){
    SERVICES = list.length ? list : DEFAULT_SERVICES;
    var grid = document.getElementById('svGrid');
    grid.innerHTML = '';
    SERVICES.forEach(function(s, idx){
      var card = document.createElement('div');
      card.className = 'sv-card';
      card.setAttribute('data-name', s.name);
      card.innerHTML =
        '<div class="ic">' + esc(s.icon || '🔧') + '</div>' +
        '<div class="nm">' + esc(s.name) + '</div>' +
        '<div class="ds">' + esc(s.description || '') + '</div>' +
        '<div class="pr">' + esc(s.price || '') + '</div>' +
        '<span class="go">预约此项 →</span>' +
        '<span class="check">✓</span>';
      card.addEventListener('click', function(){ selectService(s.name, card); });
      grid.appendChild(card);
    });
    // 下拉框
    var sel = document.getElementById('service');
    sel.innerHTML = '';
    SERVICES.forEach(function(s){
      var o = document.createElement('option'); o.textContent = s.name; sel.appendChild(o);
    });
    if(SERVICES[0]) selectService(SERVICES[0].name, grid.querySelector('.sv-card'));
  }

  function selectService(name, card){
    document.querySelectorAll('.sv-card').forEach(function(c){ c.classList.remove('selected'); });
    if(card) card.classList.add('selected');
    document.getElementById('service').value = name;
  }

  function copyWechat(){
    var w = SETTINGS.wechat || '';
    if(!w){ alert('微信号暂未设置'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(w).then(function(){ toast('微信号已复制：'+w); }, function(){ fallbackCopy(w); });
    } else { fallbackCopy(w); }
  }
  function fallbackCopy(text){
    var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); toast('微信号已复制：'+text);
  }
  function toast(t){
    var el=document.getElementById('toast'); if(!el){
      el=document.createElement('div'); el.id='toast';
      el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e1b4b;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;z-index:99;';
      document.body.appendChild(el);
    }
    el.textContent=t; el.style.display='block';
    setTimeout(function(){ el.style.display='none'; },1800);
  }

  async function loadContent(){
    if(sb){
      try {
        var st = await sb.from('settings').select('*');
        if(!st.error && st.data){
          var map={}; st.data.forEach(function(r){ map[r.key]=r.value; });
          SETTINGS = {
            hero_title: map.hero_title || DEFAULTS.hero_title,
            hero_subtitle: map.hero_subtitle || DEFAULTS.hero_subtitle,
            contact: map.contact || DEFAULTS.contact,
            phone: map.phone || DEFAULTS.phone,
            wechat: map.wechat || DEFAULTS.wechat,
            notice: map.notice || DEFAULTS.notice,
            footer: map.footer || DEFAULTS.footer
          };
        }
        var sv = await sb.from('services').select('*').order('sort_order');
        if(!sv.error && sv.data && sv.data.length){
          SERVICES = sv.data;
        }
      } catch(e){ /* 用默认值 */ }
    }
    applySettings();
    renderServices(SERVICES);
  }

  loadContent();

  document.getElementById('orderForm').addEventListener('submit', function(e){
    e.preventDefault();
    var order = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      service: document.getElementById('service').value,
      device: document.getElementById('device').value,
      problem: document.getElementById('desc').value
    };
    var box = document.getElementById('result');
    box.style.display='block';
    if(sb){
      sb.from('orders').insert([order]).then(function(res){
        if(res.error){
          box.className='err-box';
          box.innerHTML='❌ 提交失败：'+esc(res.error.message);
        } else {
          box.className='ok-box';
          box.innerHTML='✅ 预约成功！我们会尽快通过 <b>'+esc(order.phone)+'</b> 联系你。';
          e.target.reset();
          if(SERVICES[0]) selectService(SERVICES[0].name, document.querySelector('.sv-card'));
        }
      });
    } else {
      box.className='demo-box';
      box.innerHTML='⚠️ 当前是演示模式（还没连接数据库），预约暂存本机浏览器。';
    }
  });
</script>

</body>
</html>
